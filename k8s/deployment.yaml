apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-deployment
  annotations:
    practical-test: "argocd-auto-sync-v1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix
  template:
    metadata:
      labels:
        app: netflix
    spec:
      containers:
        - name: netflix-container
          image: netflix-clone:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

